<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luar Jasmine · 4 anos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Caveat:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink-1:#ff1f7a;
    --pink-2:#ff5da6;
    --pink-soft:#ffd7ea;
    --plum:#7a0d47;
    --gold:#e8b84b;
    --white:#fffdfc;
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  html{scroll-padding-top: env(safe-area-inset-top, 0px);}
  body{
    margin:0;
    min-height:100%;
    font-family:'Quicksand',sans-serif;
    color:var(--plum);
    display:flex;
    justify-content:center;
    background:
      repeating-conic-gradient(from 0deg at 50% -20%,
        #ff2c82 0deg 9deg, #ff5aa0 9deg 18deg);
    padding:0;
  }

  .page{
    width:100%;
    max-width:460px;
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:22px 18px 40px;
  }

  .topseal{
    width:52px;height:52px;
    margin-bottom:10px;
    filter:drop-shadow(0 6px 10px rgba(122,13,71,.35));
  }
  .topseal img{ width:100%; height:100%; object-fit:contain; }

  /* -------- cartao branco central -------- */
  .card{
    width:100%;
    background:var(--white);
    border-radius:26px;
    box-shadow:0 24px 60px -22px rgba(122,13,71,.55);
    padding:56px 24px 30px;
    text-align:center;
    position:relative;
    margin-top:44px;
  }

  .mascot-wrap{
    position:absolute;
    top:-44px;
    left:50%;
    transform:translateX(-50%);
    width:96px;height:96px;
  }
  .mascot-wrap .avatar{
    width:100%;height:100%;
    border-radius:50%;
    overflow:hidden;
    background:#fff9fb;
    border:4px solid #fff;
    box-shadow:0 10px 22px -8px rgba(122,13,71,.55);
  }
  .mascot-wrap .avatar img{
    width:100%;height:100%;
    object-fit:cover;
    object-position:50% 18%;
    transform:scale(1.55);
  }
  .mascot-wrap .badge{
    position:absolute;
    bottom:-2px; right:-2px;
    width:32px;height:32px;
    border-radius:50%;
    background:#fff;
    padding:4px;
    box-shadow:0 4px 10px -3px rgba(122,13,71,.5);
  }
  .mascot-wrap .badge img{ width:100%;height:100%;object-fit:contain; }

  h1.title{
    font-family:'Fredoka',sans-serif;
    font-weight:700;
    font-size:38px;
    line-height:1.02;
    letter-spacing:.5px;
    margin:4px 0 0;
    color:var(--pink-1);
    text-shadow:1px 1px 0 rgba(122,13,71,.15);
  }
  .title-age{
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    font-size:26px;
    color:var(--plum);
    margin-top:2px;
  }

  p.msg{
    margin:18px auto 0;
    max-width:280px;
    font-size:15px;
    line-height:1.55;
    font-weight:600;
    color:#7a0d47;
  }

  /* -------- faixa de data / hora -------- */
  .datebar{
    margin-top:22px;
    background:var(--pink-soft);
    border:2px dashed var(--pink-2);
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
    gap:10px;
  }
  .datebar .col{ text-align:left; flex:1; }
  .datebar .col.right{ text-align:right; }
  .datebar .row{ display:flex; align-items:center; gap:8px; }
  .datebar .row.right-row{ justify-content:flex-end; }
  .datebar .value{ font-family:'Fredoka',sans-serif; font-weight:600; font-size:15px; line-height:1.15; }
  .datebar svg{ flex:0 0 auto; }
  .starbadge{
    flex:0 0 auto;
    width:48px;height:48px;
    border-radius:50%;
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 16px -6px rgba(255,31,122,.5);
    padding:6px;
  }
  .starbadge img{ width:100%;height:100%;object-fit:contain; }

  /* -------- botoes circulares de acao -------- */
  .actions{
    display:flex;
    justify-content:space-between;
    margin-top:26px;
    gap:10px;
  }
  .action{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    background:none;
    border:none;
    cursor:pointer;
    font-family:'Quicksand',sans-serif;
    color:var(--plum);
    text-decoration:none;
  }
  .action:focus-visible{ outline:3px solid var(--gold); outline-offset:3px; border-radius:50%; }
  .action .circle{
    width:60px;height:60px;
    border-radius:50%;
    border:2px dashed var(--pink-2);
    display:flex;align-items:center;justify-content:center;
    background:var(--pink-soft);
    transition:transform .15s ease;
  }
  .action:active .circle{ transform:scale(.92); }
  .action .lbl{
    font-size:12.5px;
    font-weight:700;
    line-height:1.2;
  }

  .footer-location{
    margin-top:22px;
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    font-size:14px;
    color:var(--pink-1);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .footer-location .zig{ font-size:14px; opacity:.6; }

  .credit{
    margin-top:18px;
    display:flex;
    justify-content:center;
  }
  .credit img{
    height:54px;
    width:auto;
    opacity:.92;
  }

  /* ================= MODAL DE PRESENTES ================= */
  .overlay{
    position:fixed; inset:0;
    background:rgba(122,13,71,.55);
    display:flex; align-items:center; justify-content:center;
    z-index:50;
    opacity:0; pointer-events:none;
    transition:opacity .25s ease;
    padding:20px;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }

  .sheet{
    width:100%; max-width:400px;
    background:linear-gradient(180deg,#fff 0%, var(--pink-soft) 100%);
    border-radius:26px;
    padding:26px 22px 24px;
    max-height:85vh;
    overflow-y:auto;
    transform:scale(.92);
    transition:transform .25s ease;
    position:relative;
    text-align:center;
  }
  .overlay.open .sheet{ transform:scale(1); }

  .close-btn{
    position:absolute; top:14px; right:14px;
    border:none; background:#fff; color:var(--pink-1);
    width:32px;height:32px;border-radius:50%;
    font-size:16px; font-weight:700; cursor:pointer;
    box-shadow:0 4px 10px -4px rgba(122,13,71,.4);
  }

  .sheet h2{
    font-family:'Caveat',cursive;
    font-size:34px;
    margin:6px 0 18px;
    color:var(--pink-1);
  }

  .gift-item{
    display:flex; align-items:center; gap:14px;
    margin-bottom:12px;
    text-align:left;
  }
  .gift-item .gic{
    flex:0 0 auto;
    width:48px;height:48px;
    border-radius:50%;
    background:#fff;
    border:2px dashed var(--pink-1);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;
  }
  .gift-item .gpill{
    flex:1;
    background:var(--pink-soft);
    border-radius:999px;
    padding:14px 18px;
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    font-size:15px;
    color:var(--plum);
    line-height:1.2;
  }
  .gift-item .gpill small{ display:block; font-weight:500; font-size:12px; color:#a15079; }

  @media (prefers-reduced-motion: reduce){
    .action .circle, .overlay, .sheet{ transition:none; }
  }
</style>
</head>

  <!-- Modal com a lista de presentes -->
  <div class="overlay" id="overlay">
    <div class="sheet">
      <button class="close-btn" id="btn-fechar" aria-label="Fechar">✕</button>
      <h2>💗 Sugestões de presentes 💗</h2>
      <div id="lista-presentes"></div>
    </div>
  </div>

<script>
/* ======================================================
   CONFIG - edite so esta parte com os dados da sua festa
   ====================================================== */
const CONFIG = {
  nome: "LUAR JASMINE",              // pode usar <br> para quebrar linha
  idade: "4 anos",
  mensagem: "Espero você para comemorar comigo esse dia tão especial!",
  data: "25 de outubro",
  hora: "16:00h",

  // Numero de WhatsApp para confirmacao de presenca.
  whatsappNumero: "5579998016501",
  whatsappMensagem: "Oiie! Confirmando minha presença na festa da Jasmine 🎀",

  // Localizacao: cole aqui o link do Google Maps do local
  localizacaoUrl: "https://maps.google.com/?q=Condominio+Barra+Clube+2",
  localizacaoTexto: "Condomínio Barra Clube 2",

  // Lista de presentes
  presentes: [
    { emoji: "👗", nome: "Vestido", obs: "Tamanho 4" },
    { emoji: "🌸", nome: "Perfume", obs: "" },
    { emoji: "💗", nome: "Pix", obs: "Qualquer valor é bem-vindo" }
  ]
};
/* ====================================================== */

document.getElementById('nome').innerHTML = CONFIG.nome;
document.getElementById('idade').textContent = CONFIG.idade;
document.getElementById('mensagem').textContent = CONFIG.mensagem;
document.getElementById('data').textContent = CONFIG.data;
document.getElementById('hora').textContent = CONFIG.hora;
document.getElementById('local-nome').textContent = CONFIG.localizacaoTexto;

document.getElementById('btn-confirmar').href = `https://wa.me/${CONFIG.whatsappNumero}?text=${encodeURIComponent(CONFIG.whatsappMensagem)}`;
document.getElementById('btn-local').href = CONFIG.localizacaoUrl;

const lista = document.getElementById('lista-presentes');
CONFIG.presentes.forEach(item => {
  const row = document.createElement('div');
  row.className = 'gift-item';
  row.innerHTML = `
    <span class="gic">${item.emoji || '🎁'}</span>
    <span class="gpill">${item.nome}${item.obs ? `<small>${item.obs}</small>` : ''}</span>
  `;
  lista.appendChild(row);
});

const overlay = document.getElementById('overlay');
document.getElementById('btn-presentes').addEventListener('click', () => overlay.classList.add('open'));
document.getElementById('btn-fechar').addEventListener('click', () => overlay.classList.remove('open'));
overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('open'); });
</script>
